<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logobox">
            <img
                class="iconlogo"
                src="assets/icon.png"
                alt="WeatherWatch logo"
            >

            <div class="logolabel">
                Weather<span>Watch</span>
            </div>
        </div>

        <nav class="buttons">
            <a href="#" class="button active">Home</a>
            <a href="#" class="button">Forecast</a>
            <a href="#" class="button">Maps</a>
            <a href="#" class="button">News</a>
            <a href="#" class="button">Radar</a>
        </nav>

        <form class="search-form">

            <div class="find-section">

                <div class="search-box">
                    <label class="city-label" for="city">
                        Find your city
                    </label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="Find your city"
                    >

                    <button
                        type="submit"
                        class="search-button"
                        aria-label="Search"
                    >
                        <img
                            src="assets/search-icon.png"
                            alt=""
                        >
                    </button>
                </div>

                <select name="selected-city">
                    <option value="kyiv">Kyiv</option>
                </select>

            </div>

        </form>

    </header>

    <main>
        <section class="weather">
            <div class="weather-info">

                <div class="location">
                    <h1>Kyiv, Ukraine</h1>
                    <p>Monday, May 22, 2027</p>
                </div>
                <div class="weather-parameters">
                    <img src="assets/mostly-cloudly.png" alt="">
                    <div class="degrees">+21°C</div>
                    <div class="weather-type">Partly Cloudy</div>
                    <div class="feels-like">Feels Like +20°C</div>
                </div>
                <div class="advanced-weather-parameters">
                    <div class="parameters">Wind 14km/h South-West</div>
                    <div class="parameters">Humidity 68%</div>
                    <div class="parameters">Pressure 1012 hPa</div>
                    <div class="parameters">UV Index 4 <span>(Low)</span></div>
                    <div class="parameters">Sunset 20:55</div>
                </div>
                
            </div>
            <div class="radar">
                <img src="assets/radar.jpg" alt="weather-radar">
            </div>
            
        </section>


    </main>

</body>
</html>
